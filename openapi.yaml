openapi: 3.1.0
info:
  title: findtutor API
  version: 0.1.0
  description: >
    Contract for the findtutor language-tutoring marketplace (Uzbekistan).
    Hand-written and treated as the source of truth: the Go backend renders
    responses to match it, and the Next.js frontend generates its typed client
    from it (openapi-typescript + openapi-fetch).

    Money is always an integer amount in MINOR units (tiyin for UZS, cents for
    USD) plus a currency code — never a float.

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: auth
    description: >
      Email/password accounts. Login/register/refresh return a short-lived
      HS256 access token (JSON body) plus a long-lived opaque refresh token set
      as the HttpOnly `ftr_session` cookie (Path=/v1/auth, SameSite=Lax).
      Clients hold the access token in memory and send it as
      `Authorization: Bearer`; refresh rotates the cookie and revokes the old
      token (re-using a rotated token revokes the whole session chain).
  - name: teachers
    description: Teacher search and profiles
  - name: availability
    description: Teacher weekly recurring availability (stored in UTC)
  - name: bookings
    description: >
      Concrete scheduled lessons. Slots are derived by projecting a teacher's
      recurring weekly availability (UTC minutes) onto real UTC datetimes; every
      create re-checks availability server-side. All datetimes are RFC3339 UTC.
  - name: payments
    description: >
      Payment intents (one per booking) and the teacher earnings ledger. The
      MVP uses a deterministic in-process fake provider behind a
      provider-agnostic port (Stripe does not operate in Uzbekistan; a real
      Payme / Click / Uzum adapter drops in later). Money is integer minor
      units.
  - name: system

paths:
  /v1/auth/register:
    post:
      tags: [auth]
      summary: Create an account and sign in
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: >
            Account created and signed in. Body carries the access token; the
            `ftr_session` refresh cookie is set.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: "`ftr_session=<opaque>; HttpOnly; SameSite=Lax; Path=/v1/auth`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: That email is already registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/auth/login:
    post:
      tags: [auth]
      summary: Sign in
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in. Body carries the access token; the `ftr_session` refresh cookie is set.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate the refresh token
      description: >
        Reads the `ftr_session` cookie, issues a fresh access + refresh pair,
        revokes the presented refresh token, and sets the new cookie. A missing,
        expired, or already-revoked cookie returns 401 (and, on re-use of a
        revoked token, every session for that user is revoked).
      operationId: refresh
      security:
        - cookieAuth: []
      responses:
        "200":
          description: New access token in the body; new `ftr_session` cookie set.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/auth/logout:
    post:
      tags: [auth]
      summary: Sign out
      description: Revokes the current session and clears the `ftr_session` cookie. Idempotent.
      operationId: logout
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Signed out (cookie cleared). Returned even if no session was active.
          headers:
            Set-Cookie:
              schema: { type: string }

  /v1/auth/me:
    get:
      tags: [auth]
      summary: The signed-in user
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The authenticated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUser" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [auth]
      summary: Edit the signed-in account
      description: >
        Updates the caller's own account. Only `display_name` is editable;
        changing the email is out of scope and any `email` key in the body is
        ignored. Omitting `display_name` is a no-op that returns the account
        unchanged.
      operationId: updateCurrentUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMeRequest" }
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUser" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /healthz:
    get:
      tags: [system]
      summary: Liveness and dependency health
      operationId: getHealth
      responses:
        "200":
          description: All backing services reachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: One or more backing services are unreachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /v1/teachers:
    get:
      tags: [teachers]
      summary: Search teachers
      operationId: listTeachers
      parameters:
        - name: language
          in: query
          description: Filter to teachers who teach this language (ISO 639-1 code, e.g. `en`).
          schema: { type: string }
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/TeacherKind" }
        - name: max_price_minor
          in: query
          description: Only teachers whose hourly price is at or below this amount (minor units).
          schema: { type: integer, format: int64, minimum: 0 }
        - name: q
          in: query
          description: Case-insensitive substring match across name, headline, and focus tags.
          schema: { type: string }
        - name: sort
          in: query
          schema:
            $ref: "#/components/schemas/TeacherSort"
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: A page of matching teachers plus catalog-wide facets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherListResult" }
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [teachers]
      summary: Create the caller's teacher profile
      description: >
        Claims a teacher profile for the authenticated account. One profile per
        account — a second attempt is 409. The new profile's owner is the caller.

        The body carries only the editable fields; server-controlled aggregates
        (`rating`, `review_count`, `lessons_completed`, `student_count`,
        `response_time_hours`) start at 0, `accepting_students` starts true, and
        the `slug` is generated from `display_name` (de-duplicated with a numeric
        suffix). `languages` / `focus` / `experience` are stored as given.


        On create, `display_name`, `headline`, `kind`, `country_code`,
        `country_name`, `city`, `timezone`, and `price_per_hour_minor` are
        required; a missing or blank one is a 400.
      operationId: createTeacherProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeacherProfileWritable" }
      responses:
        "201":
          description: The created profile (same shape as GET /v1/teachers/{slug}).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherProfile" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The account already has a teacher profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/teachers/me:
    get:
      tags: [teachers]
      summary: The caller's own teacher profile
      description: >
        Returns the teacher profile owned by the authenticated account, or 404
        if they have not created one yet. The dashboard uses this to decide
        between the "create profile" and the edit flow, and to get the slug for
        the availability editor.
      operationId: getMyTeacherProfile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's full teacher profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherProfile" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/teachers/{slug}:
    get:
      tags: [teachers]
      summary: Get one teacher profile
      operationId: getTeacherBySlug
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The full teacher profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherProfile" }
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [teachers]
      summary: Edit the caller's own teacher profile
      description: >
        Partial update of the profile at `slug`. Requires a Bearer token whose
        account owns the profile (`teachers.user_id`); otherwise 401 (no/invalid
        token) or 403 (not the owner — an unclaimed profile is never editable).

        Every field is optional; an omitted field is left unchanged. A present
        `languages` / `focus` / `experience` array (even `[]`) fully replaces
        that collection. The `slug` is immutable and server-controlled
        aggregates cannot be set here.
      operationId: updateTeacherProfile
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeacherProfileWritable" }
      responses:
        "200":
          description: The updated profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherProfile" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/teachers/{slug}/availability:
    get:
      tags: [availability]
      summary: Get a teacher's weekly availability
      description: >
        The teacher's recurring weekly slots, stored and returned in UTC.
        Combine `timezone` with each slot to show the grid in the teacher's
        local time; booking will do the same conversion server-side.
      operationId: getTeacherAvailability
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The teacher's full weekly availability.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeeklyAvailability" }
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [availability]
      summary: Replace a teacher's weekly availability
      description: >
        Replaces the teacher's **entire** weekly set with the slots in the body
        (send `[]` to clear it).

        Requires a Bearer access token whose user owns the teacher profile
        (`teachers.user_id`); otherwise 401 (no/invalid token) or 403 (not the
        owner).

        Validation: `weekday` in 0–6; `0 <= start_minute < end_minute <= 1440`;
        both bounds a multiple of `granularity_minutes` (15); no two slots on the
        same weekday may overlap (touching slots are allowed).
      operationId: replaceTeacherAvailability
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AvailabilityReplacement" }
      responses:
        "200":
          description: The stored weekly availability after replacement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeeklyAvailability" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/teachers/{slug}/slots:
    get:
      tags: [bookings]
      summary: List a teacher's concrete bookable start times
      description: >
        Projects the teacher's recurring weekly availability
        (`teacher_availability_slots`, stored as UTC minutes-from-midnight on a
        UTC weekday) onto real UTC datetimes across `[from, to]`, then removes
        any start that collides with an existing non-cancelled booking.

        Window rules: `from` defaults to now (and is clamped forward to now),
        `to` defaults to `from + 14 days`, and `to - from` may not exceed 21
        days (400 otherwise). Slots are never generated in the past.

        A start time is included only if `[start, start + duration]` fits
        entirely inside one availability window. Windows the frontend split
        across 00:00 UTC are stitched back together first, so a lesson may
        legitimately straddle UTC midnight. Candidate starts step every 30
        minutes from the start of each window.

        `price.amount_minor = round(price_per_hour_minor * duration / 60)` in
        integer minor units, rounded half-up.
      operationId: listTeacherSlots
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: RFC3339 UTC. Defaults to now.
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: RFC3339 UTC. Defaults to from + 14 days. Max span 21 days.
        - name: duration
          in: query
          required: false
          schema: { type: integer, enum: [30, 60, 90, 120], default: 60 }
          description: Lesson length in minutes.
      responses:
        "200":
          description: The bookable start times in the window.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherSlots" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/bookings:
    post:
      tags: [bookings]
      summary: Book a lesson
      description: >
        Creates a booking in `pending_payment` and opens a `requires_payment`
        payment intent for its price. The server re-derives the bookable slot
        set and rejects a `start_at` that is not a real, currently free slot; it
        never trusts a client-supplied price.

        `duration_minutes` must be one of 30/60/90/120. When `is_trial` is true
        the duration is forced to 30 minutes and the price is the teacher's
        `trial_price_minor` (400 if the teacher offers no trial). You cannot
        book your own teacher profile.

        The student then calls `POST /v1/bookings/{id}/pay` to authorise
        payment, which confirms the booking.
      operationId: createBooking
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBookingRequest" }
      responses:
        "201":
          description: The created booking.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: >
            The slot is not bookable (`slot_unavailable` — outside availability,
            misaligned, in the past, or already taken) or was taken by a
            concurrent request between the check and the insert (`slot_taken`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [bookings]
      summary: List the caller's bookings
      description: >
        With no `role`, returns every booking the caller participates in (as
        student or as the owner of the teacher profile). `role=student` limits
        it to bookings the caller booked; `role=teacher` to bookings for the
        teacher profile the caller owns (empty if they own none). Newest lesson
        first. Optional `status` filter.
      operationId: listBookings
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: query
          required: false
          schema: { type: string, enum: [student, teacher] }
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/BookingStatus" }
      responses:
        "200":
          description: The matching bookings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingList" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/bookings/{id}:
    get:
      tags: [bookings]
      summary: Get one booking
      operationId: getBooking
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The booking.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/bookings/{id}/pay:
    post:
      tags: [bookings]
      summary: Pay for a booking
      description: >
        Authorises payment for a `pending_payment` booking and, on success,
        moves it to `confirmed` (the payment webhook performs the transition).
        Student-only — only the account that booked the lesson may pay.

        The `method_token` is an opaque payment-method handle. The MVP ships a
        deterministic fake provider (Stripe does not operate in Uzbekistan);
        its tokens drive the outcome:
        `pm_ok` authorises, `pm_decline` is refused (402 `payment_failed`),
        `pm_capture_fail` authorises but fails the first capture at completion.

        Response is the booking with its embedded `payment` (now `authorized`).
      operationId: payBooking
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayBookingRequest" }
      responses:
        "200":
          description: The confirmed booking with its authorised payment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller is not the student who booked this lesson (`forbidden`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "402":
          description: The payment method was declined (`payment_failed`). The booking stays `pending_payment`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The booking is already paid (`already_paid`) or is cancelled
            (`invalid_state`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/bookings/{id}/complete:
    post:
      tags: [bookings]
      summary: Complete a lesson
      description: >
        Moves a `confirmed` booking to `completed` and captures the payment,
        then writes the teacher's payout-ledger entry. Teacher-owner only.
        Allowed only once the lesson's `end_at` is in the past (409 `too_early`
        otherwise).

        Capture happens before the status flips, so a capture failure leaves
        the booking `confirmed` and retryable (502 `capture_failed`).
      operationId: completeBooking
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The completed booking with its captured payment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller is not the teacher for this lesson (`forbidden`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The booking is not `confirmed` (`invalid_state`) or the lesson has
            not ended yet (`too_early`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: The provider could not capture the hold (`capture_failed`). The booking stays `confirmed`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/bookings/{id}/cancel:
    post:
      tags: [bookings]
      summary: Cancel a booking
      description: >
        Moves `pending_payment` or `confirmed` -> `cancelled`, recording
        `cancelled_at` and the optional `reason`. Participant-only. For the MVP
        cancellation is allowed at any time (no window / penalties yet). Already
        `completed` or `cancelled` -> 409.

        Payment side effects: an `authorized` intent is refunded in full (the
        hold is released); an intent that was never authorised is voided. If a
        payout-ledger row exists it is reversed.
      operationId: cancelBooking
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelBookingRequest" }
      responses:
        "200":
          description: The cancelled booking.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The booking is already completed or cancelled (`invalid_state`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/payments/webhook:
    post:
      tags: [payments]
      summary: Payment provider webhook
      description: >
        Receives one provider state-change event. Unauthenticated — a real
        provider signs the body and the handler verifies the
        `X-Payment-Signature` header (HMAC-SHA256) when a secret is configured.

        Idempotent by `event_id`: the id is inserted into `payment_events`
        under its primary key, and a duplicate is treated as already processed.
        A well-formed event always returns 200, with `applied` telling whether
        this delivery was the one that ran the effect.

        Events: `payment.authorized` (payment -> authorized, booking
        `pending_payment` -> `confirmed`), `payment.captured` (payment ->
        captured, payout-ledger row `held` -> `available`), `payment.refunded`
        (payment -> refunded, ledger row -> `reversed`), `payment.failed`
        (payment -> failed).

        The MVP's in-process fake provider reaches the same handler code via an
        internal sink rather than an HTTP call.
      operationId: paymentsWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentWebhookEvent" }
      responses:
        "200":
          description: The event was accepted (newly applied or a recognised duplicate).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentWebhookAck" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The webhook signature did not verify.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/payments/me:
    get:
      tags: [payments]
      summary: The caller's teacher earnings summary
      description: >
        Aggregates the caller-owned teacher profile's payout-ledger. `held` is
        money captured but not yet payable, `available` is payable now (the MVP
        has no clearing window, so a lesson lands `available` the moment it is
        captured), and reversed lessons are excluded from the totals.
        404 if the caller owns no teacher profile.
      operationId: getMyEarnings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The earnings summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherEarnings" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived HS256 access token from /v1/auth/{login,register,refresh}.
    cookieAuth:
      type: apiKey
      in: cookie
      name: ftr_session
      description: >
        HttpOnly opaque refresh token, Path=/v1/auth, SameSite=Lax. Set by the
        auth endpoints; the browser sends it automatically to /v1/auth/refresh
        and /v1/auth/logout. Not readable or settable by client JS.

  responses:
    BadRequest:
      description: The request was malformed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The caller is not allowed to perform this action.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable, machine-readable identifier (e.g. `not_found`).
            message:
              type: string
              description: Human-readable explanation, safe to surface to users.

    RegisterRequest:
      type: object
      required: [email, password, display_name]
      properties:
        email: { type: string, format: email }
        password:
          type: string
          minLength: 8
          description: Minimum 8 characters.
        display_name: { type: string, minLength: 1 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    UpdateMeRequest:
      type: object
      description: >
        Fields to change on the caller's account. All optional; an omitted field
        is left unchanged. `email` is not editable and is ignored if sent.
      properties:
        display_name: { type: string, minLength: 1 }

    AuthUser:
      type: object
      required: [id, email, display_name]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }

    AuthResponse:
      type: object
      description: >
        The access token (hold in memory, send as `Authorization: Bearer`) plus
        the user. The refresh token is NOT here — it is the `ftr_session` cookie.
      required: [access_token, expires_in, user]
      properties:
        access_token: { type: string, description: HS256 JWT. }
        expires_in:
          type: integer
          description: Access-token lifetime in seconds.
        user: { $ref: "#/components/schemas/AuthUser" }

    Health:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, down]

    Currency:
      type: string
      enum: [UZS, USD]

    Money:
      type: object
      required: [amount_minor, currency]
      properties:
        amount_minor:
          type: integer
          format: int64
          description: Amount in minor units (tiyin / cents). 9000000 UZS == 90,000 so'm.
        currency: { $ref: "#/components/schemas/Currency" }

    TeacherKind:
      type: string
      enum: [professional, community]
      description: >
        `professional` — certified/qualified teacher, structured lessons.
        `community` — conversation practice, informal tutoring.

    TeacherSort:
      type: string
      enum: [recommended, price_asc, price_desc, rating_desc]
      default: recommended

    LanguageLevel:
      type: string
      enum: [native, c2, c1, b2, b1, a2, a1]

    Language:
      type: object
      required: [code, name, level]
      properties:
        code: { type: string, description: ISO 639-1 }
        name: { type: string }
        level: { $ref: "#/components/schemas/LanguageLevel" }

    Experience:
      type: object
      required: [title, org, period]
      properties:
        title: { type: string }
        org: { type: string }
        period:
          type: string
          description: Free text, e.g. "2019 – present".

    TeacherSummary:
      type: object
      description: Card view used in search results.
      required:
        - id
        - slug
        - display_name
        - headline
        - kind
        - country_code
        - country_name
        - city
        - timezone
        - teaches
        - also_speaks
        - price_per_hour
        - rating
        - review_count
        - lessons_completed
        - student_count
        - focus
        - response_time_hours
        - accepting_students
        - avatar_url
        - video_thumbnail_url
      properties:
        id: { type: string, format: uuid }
        slug:
          type: string
          description: URL-safe, stable; used in /teachers/{slug}.
        display_name: { type: string }
        headline:
          type: string
          description: One-line hook in the teacher's own words.
        kind: { $ref: "#/components/schemas/TeacherKind" }
        country_code: { type: string, description: ISO 3166-1 alpha-2 }
        country_name: { type: string }
        city: { type: string }
        timezone:
          type: string
          description: IANA name, e.g. "Asia/Tashkent". Source of truth for slot conversion.
        teaches:
          type: array
          items: { $ref: "#/components/schemas/Language" }
        also_speaks:
          type: array
          items: { $ref: "#/components/schemas/Language" }
        price_per_hour: { $ref: "#/components/schemas/Money" }
        rating:
          type: number
          format: float
          minimum: 0
          maximum: 5
          description: Aggregate rating to one decimal.
        review_count: { type: integer, minimum: 0 }
        lessons_completed: { type: integer, minimum: 0 }
        student_count: { type: integer, minimum: 0 }
        focus:
          type: array
          items: { type: string }
          description: Free-text focus tags, e.g. "IELTS", "Kids & teens".
        response_time_hours:
          type: integer
          minimum: 0
          description: Median hours to reply to a booking request.
        accepting_students: { type: boolean }
        avatar_url: { type: string, format: uri }
        video_thumbnail_url: { type: string, format: uri }

    TeacherProfile:
      description: Full profile — every summary field plus the long-form content.
      allOf:
        - $ref: "#/components/schemas/TeacherSummary"
        - type: object
          required:
            - intro_video_url
            - about
            - teaching_style
            - experience
          properties:
            intro_video_url: { type: string, format: uri }
            about:
              type: string
              description: Long-form, plain text; paragraphs separated by "\n\n".
            teaching_style: { type: string }
            experience:
              type: array
              items: { $ref: "#/components/schemas/Experience" }
            trial_price:
              description: Present only when the teacher offers a trial lesson.
              $ref: "#/components/schemas/Money"

    LanguageEntry:
      type: object
      description: >
        One row of the `languages` collection in a write request. `role` splits
        into the read shape's `teaches` / `also_speaks` arrays.
      required: [role, code, name, level]
      properties:
        role:
          type: string
          enum: [teaches, also_speaks]
        code: { type: string, description: ISO 639-1 }
        name: { type: string }
        level: { $ref: "#/components/schemas/LanguageLevel" }

    TeacherProfileWritable:
      type: object
      description: >
        The caller-editable profile fields shared by create and update. Money
        stays in integer minor units. Server-controlled aggregates (`rating`,
        `review_count`, `lessons_completed`, `student_count`,
        `response_time_hours`, `accepting_students`) and `slug` are never
        accepted here.
      properties:
        display_name: { type: string, minLength: 1 }
        headline: { type: string, minLength: 1 }
        kind: { $ref: "#/components/schemas/TeacherKind" }
        country_code: { type: string, minLength: 1, description: ISO 3166-1 alpha-2 }
        country_name: { type: string, minLength: 1 }
        city: { type: string, minLength: 1 }
        timezone:
          type: string
          minLength: 1
          description: IANA name, e.g. "Asia/Tashkent". Must resolve via the tz database.
        price_per_hour_minor: { type: integer, format: int64, minimum: 0 }
        trial_price_minor:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: Omit or null for "no trial lesson offered".
        currency:
          allOf: [{ $ref: "#/components/schemas/Currency" }]
          description: Must be `UZS` (the only supported currency). Defaults to `UZS` on create.
        about: { type: string }
        teaching_style: { type: string }
        avatar_url: { type: string }
        intro_video_url: { type: string }
        video_thumbnail_url: { type: string }
        languages:
          type: array
          items: { $ref: "#/components/schemas/LanguageEntry" }
        focus:
          type: array
          items: { type: string, minLength: 1 }
        experience:
          type: array
          items: { $ref: "#/components/schemas/Experience" }

    LanguageFacet:
      type: object
      required: [code, name, count]
      properties:
        code: { type: string }
        name: { type: string }
        count:
          type: integer
          minimum: 0
          description: Number of teachers in the catalog who teach this language.

    TeacherListResult:
      type: object
      required: [teachers, total, facets]
      properties:
        teachers:
          type: array
          items: { $ref: "#/components/schemas/TeacherSummary" }
        total:
          type: integer
          minimum: 0
          description: Total matches across all pages.
        facets:
          type: object
          required: [languages]
          properties:
            languages:
              type: array
              items: { $ref: "#/components/schemas/LanguageFacet" }

    AvailabilitySlot:
      type: object
      description: >
        One recurring availability span on a single weekday, in UTC. Times are
        minutes from 00:00 UTC (like money's minor units — an integer, never a
        clock string). `end_minute` is exclusive.
      required: [weekday, start_minute, end_minute]
      properties:
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 = Sunday … 6 = Saturday (matches JS `Date.getDay()`).
        start_minute:
          type: integer
          minimum: 0
          maximum: 1425
          description: Minutes from 00:00 UTC. Multiple of `granularity_minutes`.
        end_minute:
          type: integer
          minimum: 15
          maximum: 1440
          description: Exclusive end, minutes from 00:00 UTC. Greater than `start_minute`.

    WeeklyAvailability:
      type: object
      description: A teacher's full weekly recurring availability, in UTC.
      required: [teacher_slug, timezone, granularity_minutes, slots]
      properties:
        teacher_slug: { type: string }
        timezone:
          type: string
          description: >
            The teacher's IANA timezone (e.g. "Asia/Tashkent"). Use it to render
            the UTC slots in local time.
        granularity_minutes:
          type: integer
          description: The grid every slot boundary aligns to (currently 15).
        slots:
          type: array
          items: { $ref: "#/components/schemas/AvailabilitySlot" }
          description: Ordered by weekday, then start_minute. Non-overlapping.

    AvailabilityReplacement:
      type: object
      description: The full weekly set to store. An empty array clears availability.
      required: [slots]
      properties:
        slots:
          type: array
          items: { $ref: "#/components/schemas/AvailabilitySlot" }

    BookingStatus:
      type: string
      enum: [pending_payment, confirmed, completed, cancelled]

    Slot:
      type: object
      description: One concrete bookable start time with its price.
      required: [start_at, end_at, price]
      properties:
        start_at: { type: string, format: date-time, description: RFC3339 UTC. }
        end_at: { type: string, format: date-time, description: RFC3339 UTC — start_at + duration. }
        price: { $ref: "#/components/schemas/Money" }

    TeacherSlots:
      type: object
      required: [teacher_slug, timezone, from, to, duration_minutes, slots]
      properties:
        teacher_slug: { type: string }
        timezone:
          type: string
          description: The teacher's IANA timezone, for display only — the slot math is pure UTC.
        from: { type: string, format: date-time, description: Effective window start (RFC3339 UTC). }
        to: { type: string, format: date-time, description: Effective window end (RFC3339 UTC). }
        duration_minutes: { type: integer, enum: [30, 60, 90, 120] }
        slots:
          type: array
          items: { $ref: "#/components/schemas/Slot" }
          description: Ordered by start_at.

    BookingTeacherSummary:
      type: object
      description: Light teacher summary embedded in a booking so lists avoid N+1 calls.
      required: [slug, display_name, timezone, avatar_url]
      properties:
        slug: { type: string }
        display_name: { type: string }
        timezone: { type: string, description: IANA name. }
        avatar_url: { type: string }

    BookingStudentSummary:
      type: object
      required: [id, display_name]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }

    Booking:
      type: object
      required:
        - id
        - status
        - start_at
        - end_at
        - duration_minutes
        - is_trial
        - price
        - created_at
        - cancelled_at
        - teacher
        - student
        - payment
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/BookingStatus" }
        start_at: { type: string, format: date-time, description: RFC3339 UTC. }
        end_at: { type: string, format: date-time, description: RFC3339 UTC. }
        duration_minutes: { type: integer }
        is_trial: { type: boolean }
        price: { $ref: "#/components/schemas/Money" }
        created_at: { type: string, format: date-time }
        cancelled_at:
          type: string
          format: date-time
          nullable: true
          description: Set when status is `cancelled`, otherwise null.
        cancellation_reason:
          type: string
          description: Present (may be empty) only once cancelled; omitted otherwise.
        teacher: { $ref: "#/components/schemas/BookingTeacherSummary" }
        student: { $ref: "#/components/schemas/BookingStudentSummary" }
        payment:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/BookingPayment" }]
          description: >
            The booking's payment intent. Null when there is none yet, and
            omitted from list responses (only single-booking responses embed
            it).

    BookingPayment:
      type: object
      description: The payment intent embedded in a booking.
      required: [status, amount_minor, currency]
      properties:
        status:
          type: string
          enum: [requires_payment, authorized, captured, refunded, failed]
        amount_minor: { type: integer, format: int64, description: Integer minor units. }
        currency: { type: string }

    PayBookingRequest:
      type: object
      required: [method_token]
      properties:
        method_token:
          type: string
          description: >
            Opaque payment-method handle. Fake-provider tokens: `pm_ok`,
            `pm_decline`, `pm_capture_fail`.

    PaymentWebhookEvent:
      type: object
      required: [event_id, type, payment_id]
      properties:
        event_id:
          type: string
          description: Stable per state change; replaying it is a no-op.
        type:
          type: string
          enum: [payment.authorized, payment.captured, payment.refunded, payment.failed]
        payment_id: { type: string, format: uuid }
        provider_ref: { type: string, description: The provider's reference for the intent/charge. }
        amount_minor: { type: integer, format: int64 }
        currency: { type: string }
        message: { type: string, description: Human-readable detail, used as last_error on payment.failed. }

    PaymentWebhookAck:
      type: object
      required: [received, applied]
      properties:
        received: { type: boolean }
        applied:
          type: boolean
          description: True when this delivery ran the effect; false for a recognised duplicate.

    TeacherEarnings:
      type: object
      required: [total_earned_minor, held_minor, available_minor, currency, lessons]
      properties:
        total_earned_minor:
          type: integer
          format: int64
          description: held + available (integer minor units); excludes reversed lessons.
        held_minor: { type: integer, format: int64 }
        available_minor: { type: integer, format: int64 }
        currency: { type: string }
        lessons:
          type: array
          items: { $ref: "#/components/schemas/EarningLesson" }

    EarningLesson:
      type: object
      required: [booking_id, student_display_name, start_at, amount_minor, state]
      properties:
        booking_id: { type: string, format: uuid }
        student_display_name: { type: string }
        start_at: { type: string, format: date-time, description: RFC3339 UTC. }
        amount_minor: { type: integer, format: int64 }
        state:
          type: string
          enum: [held, available, reversed]

    BookingList:
      type: object
      required: [bookings]
      properties:
        bookings:
          type: array
          items: { $ref: "#/components/schemas/Booking" }

    CreateBookingRequest:
      type: object
      required: [teacher_slug, start_at, duration_minutes]
      properties:
        teacher_slug: { type: string }
        start_at:
          type: string
          format: date-time
          description: RFC3339 UTC. Must be in the future and a real bookable slot.
        duration_minutes:
          type: integer
          enum: [30, 60, 90, 120]
          description: Ignored when is_trial is true (forced to 30).
        is_trial:
          type: boolean
          default: false
          description: A trial lesson — 30 minutes, priced at the teacher's trial_price.

    CancelBookingRequest:
      type: object
      description: Optional body. Omit entirely for a reason-less cancellation.
      properties:
        reason: { type: string }
